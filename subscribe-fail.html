<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXION · 결제 실패</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#101620;--paper:#f4f5f7;--gold:#b3925a;--gold-soft:#d5bf95;
  --serif:'Cormorant Garamond','Georgia',serif;--sans:'Inter','Noto Sans KR',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--ink);color:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{max-width:520px;width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(200,90,90,.35);border-radius:16px;padding:48px 42px;text-align:center}
.mark{width:66px;height:66px;margin:0 auto 24px;border-radius:50%;background:#c0554f;display:flex;align-items:center;justify-content:center}
.mark svg{width:32px;height:32px}
h1{font-family:var(--serif);font-weight:600;font-size:2rem;color:#fff;margin-bottom:12px}
.lead{color:rgba(244,245,247,.7);line-height:1.7;font-size:.95rem;margin-bottom:26px}
.info{text-align:left;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:18px 20px;font-size:.85rem;margin-bottom:26px}
.info .row{display:flex;justify-content:space-between;padding:7px 0;gap:16px}
.info .k{color:rgba(244,245,247,.5)}
.info .v{color:#fff;font-weight:500;text-align:right;word-break:break-all}
.btn{display:inline-block;padding:14px 32px;border-radius:9px;background:var(--gold);color:var(--ink);font-weight:600;text-decoration:none;font-size:.92rem}
.btn.ghost{background:transparent;border:1px solid rgba(179,146,90,.5);color:var(--gold-soft);margin-left:8px}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24"><path fill="#fff" d="M18.3 5.7 12 12l-6.3-6.3-1.4 1.4L10.6 13.4 4.3 19.7l1.4 1.4L12 14.8l6.3 6.3 1.4-1.4-6.3-6.3 6.3-6.3z"/></svg></div>
  <h1>결제를 완료하지 못했어요</h1>
  <p class="lead">카드 인증이 취소되었거나 오류가 발생했습니다.<br>다시 시도하거나 고객센터로 문의해 주세요.</p>
  <div class="info">
    <div class="row"><span class="k">오류 코드</span><span class="v" id="vCode">—</span></div>
    <div class="row"><span class="k">오류 메시지</span><span class="v" id="vMsg">—</span></div>
  </div>
  <a class="btn" href="subscribe.html">다시 시도</a>
  <a class="btn ghost" href="index.html">홈으로</a>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('vCode').textContent = q.get('code') || '—';
document.getElementById('vMsg').textContent = q.get('message') || '사용자 취소';
</script>
</body>
</html>
