<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXION RESEARCH · 서비스 점검 중</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png?v=2" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Noto+Serif+KR:wght@500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101620; --paper:#f4f5f7;
  --gold:#b3925a; --gold-soft:#d5bf95;
  --serif:'Cormorant Garamond','Noto Serif KR','Georgia',serif;
  --sans:'Inter','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);background:var(--ink);color:rgba(244,245,247,.72);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;-webkit-font-smoothing:antialiased;line-height:1.9;
}
.wrap{max-width:560px;text-align:center}
.logo{display:inline-block;margin-bottom:56px}
.logo img{display:block;width:150px;height:auto}
.kicker{
  font-size:.68rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold-soft);margin-bottom:20px;
}
h1{
  font-family:var(--serif);font-weight:500;color:#fff;
  font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.35;margin-bottom:24px;
}
p{font-size:.97rem;color:rgba(244,245,247,.6)}
p+p{margin-top:14px}
.rule{width:48px;height:1px;background:var(--gold);margin:40px auto}
.contact{font-size:.9rem;color:rgba(244,245,247,.5)}
.contact a{color:var(--gold-soft);text-decoration:none;border-bottom:1px solid rgba(213,191,149,.35)}
.contact a:hover{color:#fff;border-color:#fff}
.home{
  display:inline-flex;align-items:center;gap:10px;margin-top:44px;
  padding:15px 30px;border:1px solid rgba(255,255,255,.28);
  color:#fff;text-decoration:none;
  font-size:.74rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  transition:border-color .25s,color .25s;
}
.home:hover{border-color:var(--gold-soft);color:var(--gold-soft)}
.home span{color:var(--gold-soft)}
</style>
</head>
<body>
<main class="wrap">
  <a href="/" class="logo"><img src="logos/axion-wordmark.png?v=1" alt="AXION RESEARCH" width="600" height="266"></a>

  <div class="kicker">Temporarily Unavailable</div>
  <h1>구독 결제 서비스를<br>일시 중단했습니다.</h1>

  <p>서비스 점검 및 내부 재정비를 위해 구독 결제 페이지 운영을 잠시 멈췄습니다.</p>
  <p>재개 일정은 확정되는 대로 안내드리겠습니다.</p>

  <div class="rule"></div>

  <p class="contact">도입 문의는 <a href="mailto:contact@axionresearch.co.kr">contact@axionresearch.co.kr</a><br>또는 02-780-0656으로 연락 주시기 바랍니다.</p>

  <a class="home" href="/">홈으로 <span>&rarr;</span></a>
</main>
</body>
</html>
